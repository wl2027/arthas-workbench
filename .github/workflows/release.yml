# GitHub Actions Workflow that publishes the plugin to the JetBrains Marketplace.
#
# It is triggered ONLY when a GitHub Release is published (i.e. a maintainer clicked
# "Publish release" on the draft prepared by build.yml). It is never triggered by a push
# or by the creation of a draft release, so signing secrets are only ever exposed for a
# trusted, human-approved release event.
#
# Running publishPlugin requires these secrets: PUBLISH_TOKEN, CERTIFICATE_CHAIN,
# PRIVATE_KEY, PRIVATE_KEY_PASSWORD.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for details.

name: Release
on:
  release:
    types: [ published ]

jobs:

  # Sign and publish the plugin to the JetBrains Marketplace repository.
  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out exactly the sources of the published release tag.
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Guard: the release tag must match the plugin version that will be published.
      - name: Validate release tag matches plugin version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^[[:space:]]*pluginVersion[[:space:]]*=' gradle.properties | head -n1 | sed -E 's/^[^=]*=[[:space:]]*//' | tr -d '[:space:]')"
          if [ -z "${VERSION}" ]; then
            echo "::error file=gradle.properties::Unable to read 'pluginVersion' from gradle.properties"
            exit 1
          fi
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "::error::Release tag '${TAG}' does not match plugin version '${VERSION}'. Aborting publish."
            exit 1
          fi
          echo "Release tag matches plugin version: ${VERSION}"

      # Guard: fail early (and list the offenders) if any required secret is missing.
      - name: Verify required secrets
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${PUBLISH_TOKEN:-}" ]; then missing+=("PUBLISH_TOKEN"); fi
          if [ -z "${CERTIFICATE_CHAIN:-}" ]; then missing+=("CERTIFICATE_CHAIN"); fi
          if [ -z "${PRIVATE_KEY:-}" ]; then missing+=("PRIVATE_KEY"); fi
          if [ -z "${PRIVATE_KEY_PASSWORD:-}" ]; then missing+=("PRIVATE_KEY_PASSWORD"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

      # Sign and publish the plugin. publishPlugin depends on the signing and changelog
      # patch tasks via build.gradle.kts, so signing happens as part of this step.
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --console=plain
