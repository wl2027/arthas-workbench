# GitHub Actions Workflow that runs the project's headless Swing UI component tests
# (the `ideaUiTest` Gradle task) on Linux, Windows and macOS.
#
# These are in-process JUnit tests that exercise Swing component / state logic headlessly.
# They are NOT RemoteRobot end-to-end tests, so no robot-server is started and no IDE
# health check is needed. If real RemoteRobot client tests are added later, give them a
# dedicated workflow that launches a full IDE with the robot-server plugin.
#
# Triggered manually.
#
# See https://github.com/JetBrains/intellij-ui-test-robot for RemoteRobot-based UI testing.

name: Run UI Tests
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  testUi:
    name: UI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:

      # Free disk space (Linux-only action; the IntelliJ Platform download is large).
      - name: Maximize Build Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Run the headless Swing UI component tests.
      - name: Run headless UI tests
        run: ./gradlew ideaUiTest --no-configuration-cache --console=plain

      # Upload a per-OS report, only on failure.
      - name: Upload UI test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore
