# GitHub Actions Workflow for testing the plugin and preparing a GitHub Release draft.
#
# Two-stage release model:
#   1. Every push / pull request runs the test suite.
#   2. On pushes to the main branch (or manual dispatch), when the current plugin
#      version still needs a release, the plugin ZIP is built and a *draft* GitHub
#      Release is created or refreshed for manual review.
#
# Publishing to JetBrains Marketplace is intentionally NOT done here. It only happens
# after a maintainer manually clicks "Publish release" (see release.yml).
#
# GitHub Actions reference: https://help.github.com/en/actions

name: Build
on:
  # Trigger on pushes to the main branch only (avoids duplicate runs for e.g. dependabot PRs).
  push:
    branches: [ main ]
  # Trigger on any pull request.
  pull_request:
  # Allow manual runs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Run the project's unit, integration and headless UI test tasks.
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      # Free GitHub Actions environment disk space (the IntelliJ Platform is large).
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository.
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up the Java environment for the next steps.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Run unit, integration and headless Swing UI component tests.
      # `--no-configuration-cache` keeps the IntelliJ Platform test tasks compatible with the
      # project's globally enabled Gradle configuration cache; `--continue` runs every category
      # even if an earlier one fails so a single report covers all of them.
      - name: Run tests
        run: >-
          ./gradlew unitTest integrationTest ideaUiTest
          --continue
          --no-configuration-cache
          --console=plain

      # Upload the HTML / XML test reports, but only when something failed.
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Detect the plugin version and decide whether a release draft should be prepared.
  # Skipped for pull requests so PRs never create or refresh a release.
  releaseCheck:
    name: Check release status
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # `contents: write` is required so the GITHUB_TOKEN can see *draft* releases
    # (drafts are only visible to tokens with repository write access).
    permissions:
      contents: write
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_prepare_release: ${{ steps.detect.outputs.should_prepare_release }}
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Detect version and release state
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Read the version from the single source of truth (gradle.properties).
          # The IntelliJ Platform Gradle Plugin maps `pluginVersion` to the project version.
          VERSION="$(grep -E '^[[:space:]]*pluginVersion[[:space:]]*=' gradle.properties | head -n1 | sed -E 's/^[^=]*=[[:space:]]*//' | tr -d '[:space:]')"
          if [ -z "${VERSION}" ]; then
            echo "::error file=gradle.properties::Unable to read 'pluginVersion' from gradle.properties"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected plugin version: ${VERSION}"

          # Four distinct states are handled. The decision relies on the release's isDraft flag,
          # NOT merely on whether a release object exists.
          should_prepare_release=false
          if is_draft=$(gh release view "${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "${is_draft}" = "true" ]; then
              echo "A draft release already exists for ${VERSION} -> it will be refreshed."
              should_prepare_release=true
            else
              echo "A published release already exists for ${VERSION} -> nothing to do."
              should_prepare_release=false
            fi
          elif gh api "repos/{owner}/{repo}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Git tag ${VERSION} already exists without a release -> nothing to do."
            should_prepare_release=false
          else
            echo "No release and no tag for ${VERSION} -> a new draft will be created."
            should_prepare_release=true
          fi
          echo "should_prepare_release=${should_prepare_release}" >> "$GITHUB_OUTPUT"

  # Build the plugin and create / refresh the draft release.
  # Runs only for non-PR events, after the tests pass, and only when a release is actually needed.
  releaseDraft:
    name: Release draft
    needs: [ test, releaseCheck ]
    if: ${{ github.event_name != 'pull_request' && needs.releaseCheck.outputs.should_prepare_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A fixed concurrency group per branch guarantees the draft for a branch is never
    # modified by two runs at the same time. Queued (not cancelled) so each refresh completes.
    concurrency:
      group: release-draft-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.releaseCheck.outputs.version }}
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Build the distributable plugin ZIP.
      - name: Build plugin
        run: ./gradlew buildPlugin --console=plain

      # Fail explicitly if the expected artifact is missing.
      - name: Verify distribution artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(build/distributions/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No plugin ZIP found in build/distributions/"
            exit 1
          fi
          echo "Found distribution(s): ${zips[*]}"

      # Generate release notes for the current version from the changelog.
      # Falls back to the Unreleased section, then to empty notes, so a missing entry
      # never aborts the draft.
      - name: Generate release notes
        run: |
          set -euo pipefail
          NOTES="build/release-notes.md"
          mkdir -p build
          if ! ./gradlew getChangelog --no-header --quiet --console=plain --no-configuration-cache --output-file="${NOTES}"; then
            ./gradlew getChangelog --no-header --quiet --console=plain --no-configuration-cache --unreleased --output-file="${NOTES}" || : > "${NOTES}"
          fi
          echo "----- release notes -----"
          cat "${NOTES}" || true

      # Create the draft when missing, or refresh the existing draft in place.
      # Re-checks the live release state to avoid ever touching a release that was
      # published while this workflow was running.
      - name: Create or refresh draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="build/release-notes.md"

          if state=$(gh release view "${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "${state}" != "true" ]; then
              echo "::error::Release ${VERSION} is already published; refusing to modify a published release."
              exit 1
            fi
            echo "Refreshing existing draft release ${VERSION}"
            # Point the draft at the latest commit and update its title / notes.
            gh release edit "${VERSION}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes-file "${NOTES}"
            # Overwrite the previous ZIP asset of the same name.
            gh release upload "${VERSION}" build/distributions/*.zip --clobber
          else
            echo "Creating new draft release ${VERSION}"
            gh release create "${VERSION}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes-file "${NOTES}" \
              build/distributions/*.zip
          fi
